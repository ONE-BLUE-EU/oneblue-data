; Shared by dev and prod.
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
upload_max_filesize = 512M
post_max_size = 512M
expose_php = Off
date.timezone = UTC

; Mail goes through msmtp, configured from SMTP_* env vars by the entrypoint.
sendmail_path = "/usr/bin/msmtp -t -i"

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 50000

apc.shm_size = 128M

; DKAN's datastore importer uses LOAD DATA LOCAL INFILE.
mysqli.allow_local_infile = On
